<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Virtual y Librería — Sistema de Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --paper:#F7F8FB;
    --paper-line:#DFE4EC;
    --ink:#16233F;
    --ink-soft:#5C6B82;
    --forest:#16233F;
    --forest-dark:#0D1730;
    --mustard:#B4903F;
    --stamp:#A23A2E;
    --stamp-soft:#EFD9D3;
    --blue:#4C6EA6;
    --blue-soft:#E1E7F1;
    --green-soft:#EFE4C9;
    --card:#FFFFFF;
    --white:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Public Sans', sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
    min-height:100vh;
  }
  h1,h2,h3,h4{ font-family:'Fraunces', serif; color:var(--forest-dark); margin:0 0 4px; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .app{ max-width:1080px; margin:0 auto; padding:20px 20px 60px; position:relative; z-index:1; }
  .bg-illustration{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bg-illustration svg{ position:absolute; right:-40px; bottom:-30px; width:620px; height:620px; opacity:.08; }
  @media(max-width:760px){ .bg-illustration svg{ width:420px; height:420px; right:-60px; bottom:-20px; } }
  .bg-catalogo{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bg-catalogo svg{ position:absolute; opacity:.07; }
  .bg-catalogo .oficina{ left:-30px; top:60px; width:260px; }
  .bg-catalogo .cocina{ left:calc(50% - 130px); bottom:-20px; width:260px; }
  .bg-catalogo .familia{ right:-30px; top:80px; width:280px; }
  .bg-catalogo .salud{ left:calc(50% - 130px); top:-10px; width:240px; }
  @media(max-width:900px){ .bg-catalogo .oficina, .bg-catalogo .familia, .bg-catalogo .salud{ display:none; } .bg-catalogo .cocina{ left:calc(50% - 110px); width:220px; } }

  /* Header */
  .masthead{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--ink); padding-bottom:14px; margin-bottom:18px;
    flex-wrap:wrap; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:44px; height:44px; border-radius:50%; background:var(--forest);
    border:2px solid var(--mustard);
    display:flex; align-items:center; justify-content:center; color:var(--white);
    font-family:'Fraunces',serif; font-weight:700; font-size:18px; flex-shrink:0;
  }
  .brand-logo{ height:48px; width:auto; flex-shrink:0; }
  .brand h1{ font-size:22px; letter-spacing:.2px; }
  .brand p{ margin:0; font-size:12px; color:var(--ink-soft); letter-spacing:.5px; text-transform:uppercase; }

  .role-tabs{ display:flex; gap:6px; background:var(--card); padding:4px; border-radius:999px; border:1px solid var(--paper-line); }
  .role-tab{
    border:none; background:transparent; padding:8px 16px; border-radius:999px; cursor:pointer;
    font-family:'Public Sans'; font-weight:600; font-size:13px; color:var(--ink-soft);
  }
  .role-tab.active{ background:var(--forest); color:var(--white); }

  /* Subnav */
  .subnav{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .subnav button{
    border:1.5px solid var(--ink); background:var(--white); padding:7px 14px; border-radius:6px;
    font-family:'Public Sans'; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink);
  }
  .subnav button.active{ background:var(--ink); color:var(--white); }

  /* Cards / layout */
  .grid{ display:grid; gap:14px; }
  .cards-4{ grid-template-columns:repeat(4,1fr); }
  .cards-2{ grid-template-columns:repeat(2,1fr); }
  @media(max-width:760px){ .cards-4{grid-template-columns:repeat(2,1fr);} .cards-2{grid-template-columns:1fr;} }

  .stat-card{ background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius); padding:14px 16px; }
  .stat-card .num{ font-family:'Fraunces',serif; font-size:30px; font-weight:700; color:var(--forest-dark); }
  .stat-card .label{ font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); }
  .stat-card.alert .num{ color:var(--stamp); }

  .panel{ background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius); padding:18px; margin-bottom:18px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }

  /* Ledger table */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-family:'IBM Plex Mono'; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); border-bottom:2px solid var(--ink); padding:8px 8px; }
  td{ padding:9px 8px; border-bottom:1px solid var(--paper-line); vertical-align:middle; }
  tr:hover td{ background:rgba(60,91,66,0.04); }
  .price{ font-family:'IBM Plex Mono'; font-weight:600; }

  /* Buttons */
  .btn{ border:none; border-radius:6px; padding:8px 14px; font-family:'Public Sans'; font-weight:600; font-size:13px; cursor:pointer; }
  .btn-primary{ background:var(--forest); color:var(--white); }
  .btn-primary:hover{ background:var(--forest-dark); }
  .btn-outline{ background:transparent; border:1.5px solid var(--ink); color:var(--ink); }
  .btn-danger{ background:transparent; border:1.5px solid var(--stamp); color:var(--stamp); }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* Stamp badges (signature element) */
  .stamp-badge{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-weight:600; font-size:10.5px; letter-spacing:.6px; text-transform:uppercase;
    border:1.5px dashed currentColor; border-radius:999px; padding:4px 10px;
    transform:rotate(-2deg);
  }
  .st-pendiente{ color:var(--stamp); }
  .st-preparando{ color:var(--mustard); }
  .st-camino{ color:var(--blue); }
  .st-listo{ color:var(--blue); }
  .st-entregado{ color:var(--forest); }
  .st-bajo{ color:var(--stamp); background:var(--stamp-soft); border-style:solid; }
  .st-ok{ color:var(--forest); }

  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--green-soft); color:var(--forest-dark); }

  /* Forms */
  label{ font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px; }
  input, select, textarea{
    width:100%; padding:8px 10px; border:1.5px solid var(--paper-line); border-radius:6px;
    font-family:'Public Sans'; font-size:13.5px; background:var(--white); color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--forest); outline-offset:1px; border-color:var(--forest); }
  .field{ margin-bottom:12px; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:600px){ .form-row{grid-template-columns:1fr;} }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(33,30,23,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--white); border-radius:var(--radius); padding:22px; width:100%; max-width:420px; max-height:90vh; overflow:auto; }

  /* Catalog */
  .cat-filter{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .cat-chip{ border:1.5px solid var(--ink); background:var(--white); padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .cat-chip.active{ background:var(--ink); color:var(--white); }
  .product-card{ background:var(--white); border:1px solid var(--paper-line); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:6px; }
  .product-card h4{ font-size:15px; }
  .product-card .cat-tag{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; }
  .product-card .row-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; }
  .product-card .thumb{ width:100%; height:110px; object-fit:cover; border-radius:6px; border:1px solid var(--paper-line); background:var(--white); }
  .thumb-sm{ width:38px; height:38px; object-fit:cover; border-radius:5px; border:1px solid var(--paper-line); vertical-align:middle; margin-right:8px; background:var(--white); }
  .thumb-placeholder{ width:38px; height:38px; border-radius:5px; border:1.5px dashed var(--paper-line); display:inline-flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink-soft); vertical-align:middle; margin-right:8px; }
  .photo-upload{ display:flex; align-items:center; gap:10px; }
  .photo-preview{ width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--paper-line); background:var(--white); }
  .photo-preview-placeholder{ width:64px; height:64px; border-radius:8px; border:1.5px dashed var(--paper-line); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-soft); text-align:center; }

  .cart-line{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--paper-line); gap:10px; }
  .qty-input{ width:56px; text-align:center; }

  .empty{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13.5px; }

  .toast-wrap{ position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:100; }
  .toast{ background:var(--ink); color:var(--white); padding:10px 16px; border-radius:8px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.2); animation:slidein .25s ease-out; }
  @keyframes slidein{ from{ transform:translateY(8px); opacity:0;} to{ transform:translateY(0); opacity:1;} }

  .foot-note{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:24px; }
  .link-reset{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; font-size:12px; }
</style>
</head>

    .then(()=>{ estadoConexion = 'conectado'; renderEstadoConexion(); })

/* Escucha cambios en tiempo real en cada colección. Cada documento sembrado
   una sola vez si la colección está totalmente vacía (primera vez que se usa
   la base de datos) — nunca vuelve a sobrescribir productos ya guardados. */
let yaSembrado = { productos:false, categorias:false, pedidos:false, cupones:false };
function activarSincronizacionEnVivo(seed){
  if(!db){
    toast('Trabajando sin conexión a la base de datos — los cambios no se guardarán');
    return;
  }
  db.collection(COL_PRODUCTOS).onSnapshot(snap=>{
    if(snap.empty && !yaSembrado.productos){
      yaSembrado.productos = true;
      seed.products.forEach(p=>guardarProducto(p));
    } else if(!snap.empty){
      state.products = snap.docs.map(d=>d.data());
      render();
    }
  }, err=>console.error('Sincronización productos', err));

  db.collection(COL_CATEGORIAS).onSnapshot(snap=>{
    if(snap.empty && !yaSembrado.categorias){
      yaSembrado.categorias = true;
      seed.categories.forEach(c=>guardarCategoriaDB(c));
    } else if(!snap.empty){
      state.categories = snap.docs.map(d=>d.data().nombre);
      render();
    }
  }, err=>console.error('Sincronización categorías', err));

  db.collection(COL_PEDIDOS).onSnapshot(snap=>{
    if(snap.empty && !yaSembrado.pedidos){
      yaSembrado.pedidos = true;
      seed.orders.forEach(o=>guardarPedido(o));
    } else if(!snap.empty){
      state.orders = snap.docs.map(d=>d.data());
      render();
    }
  }, err=>console.error('Sincronización pedidos', err));

  db.collection(COL_CUPONES).onSnapshot(snap=>{
    if(snap.empty && !yaSembrado.cupones){
      yaSembrado.cupones = true;
      guardarCuponDB({ codigo:'SALUD10', porcentaje:10, activo:true, descripcion:'Promo del mes — manuales de salud y familia' });
    } else if(!snap.empty){
      state.cupones = snap.docs.map(d=>d.data());
      render();
    }
  }, err=>console.error('Sincronización cupones', err));

  db.collection(COL_CLIENTES).onSnapshot(snap=>{
    state.clientesImportados = snap.docs.map(d=>d.data());
    render();
  }, err=>console.error('Sincronización clientes', err));

  db.collection(COL_EXCLUIDOS).onSnapshot(snap=>{
    state.clientesExcluidos = snap.docs.map(d=>d.id);
    render();
  }, err=>console.error('Sincronización exclusiones', err));

  db.collection(COL_CONFIG).doc('mensajeNovedades').onSnapshot(doc=>{
    if(doc.exists && doc.data().texto){
      state.mensajeNovedades = doc.data().texto;
      render();
    }
  }, err=>console.error('Sincronización mensaje de novedades', err));
}

function closeWelcome(){ const m=document.getElementById('welcomeModal'); if(m) m.remove(); }

function resetAll(){
  const seed = seedData();
  state.categories = seed.categories; state.products = seed.products; state.orders = seed.orders; state.cart = [];
  render();
  toast('Datos de ejemplo restablecidos');
  if(!db) return;
  const borrarColeccion = (col)=> db.collection(col).get().then(snap=>{
    const batch = db.batch();
    snap.docs.forEach(d=>batch.delete(d.ref));
    return batch.commit();
  });
  Promise.all([borrarColeccion(COL_PRODUCTOS), borrarColeccion(COL_CATEGORIAS), borrarColeccion(COL_PEDIDOS), borrarColeccion(COL_CUPONES)])
    .then(()=>{
      yaSembrado = { productos:false, categorias:false, pedidos:false, cupones:false };
      seed.products.forEach(p=>guardarProducto(p));
      seed.categories.forEach(c=>guardarCategoriaDB(c));
      seed.orders.forEach(o=>guardarPedido(o));
      guardarCuponDB({ codigo:'SALUD10', porcentaje:10, activo:true, descripcion:'Promo del mes — manuales de salud y familia' });
    })
    .catch(e=>console.error(e));
}

/* ---------- Utilidades ---------- */
function fmt(n){ return 'S/ ' + Number(n).toFixed(2); }
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function productById(id){ return state.products.find(p=>p.id===id); }
function nextId(prefix, list){
  let n = 1; while(list.some(x=>x.id === prefix+n)) n++; return prefix+n;
}
function estadosPara(tipo){
  return tipo==='delivery'
    ? ['Pendiente','Preparando','En camino','Entregado']
    : ['Pendiente','Preparando','Listo para recoger','Entregado'];
}
function stampClass(estado){
  return { 'Pendiente':'st-pendiente','Preparando':'st-preparando','En camino':'st-camino','Listo para recoger':'st-listo','Entregado':'st-entregado' }[estado] || '';
}

/* ---------- Render raíz ---------- */
function render(){
  renderRoleTabs();
  const content = document.getElementById('content');
  if(state.loading){ content.innerHTML = '<div class="empty">Cargando datos…</div>'; return; }
  if((state.role==='admin' || state.role==='repartidor') && !state.auth[state.role]){
    content.innerHTML = renderLogin(state.role);
    return;
  }
  if(state.role==='admin') content.innerHTML = renderAdmin();
  else if(state.role==='cliente') content.innerHTML = renderCliente();
  else content.innerHTML = renderRepartidor();
}

function renderLogin(role){
  const titulo = role==='admin' ? 'Acceso de Administración' : 'Acceso de Repartidor';
  return `
    <div class="panel" style="max-width:360px; margin:30px auto; text-align:center">
      <div class="brand-mark" style="margin:0 auto 12px">🔒</div>
      <h3>${titulo}</h3>
      <p style="font-size:13px; color:var(--ink-soft); margin-bottom:16px">Ingresa la clave de acceso para continuar.</p>
      <div class="field" style="text-align:left">
        <label>Clave</label>
        <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter') attemptLogin('${role}')">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="attemptLogin('${role}')">Ingresar</button>
      <button class="btn btn-outline" style="width:100%; margin-top:8px" onclick="setRole('cliente')">Volver al catálogo</button>
    </div>
  `;
}
function attemptLogin(role){
  const val = document.getElementById('loginPass').value;
  if(val === ACCESS[role]){
    state.auth[role] = true;
    toast('Acceso concedido');
    render();
  } else {
    toast('Clave incorrecta');
  }
}
function logout(role){
  state.auth[role] = false;
  state.role = 'cliente';
  render();
}

function renderRoleTabs(){
  const tabs = [
    {k:'admin', label:'Administración', protegido:true},
    {k:'cliente', label:'Cliente', protegido:false},
    {k:'repartidor', label:'Repartidor', protegido:true}
  ];
  document.getElementById('roleTabs').innerHTML = tabs.map(t=>
    `<button class="role-tab ${state.role===t.k?'active':''}" onclick="setRole('${t.k}')">${t.protegido && !state.auth[t.k] ? '🔒 ' : ''}${t.label}</button>`
  ).join('');
}
function setRole(r){ state.role = r; render(); }

/* ================= ADMIN ================= */
function renderAdmin(){
  const tabs = [
    {k:'resumen', label:'Resumen'},
    {k:'inventario', label:'Inventario'},
    {k:'categorias', label:'Categorías'},
    {k:'pedidos', label:'Pedidos'},
    {k:'clientes', label:'Clientes'}
  ];
  const nav = `<div class="subnav">${tabs.map(t=>`<button class="${state.adminTab===t.k?'active':''}" onclick="setAdminTab('${t.k}')">${t.label}</button>`).join('')}<button style="margin-left:auto" onclick="logout('admin')">Cerrar sesión</button></div>`;
  let body='';
  if(state.adminTab==='resumen') body = renderAdminResumen();
  else if(state.adminTab==='inventario') body = renderAdminInventario();
  else if(state.adminTab==='categorias') body = renderAdminCategorias();
  else if(state.adminTab==='pedidos') body = renderAdminPedidos();
  else body = renderAdminClientes();
  return nav + body;
}

/* ---------- Carga masiva de productos (Excel/CSV) ---------- */
function openBulkModal(){
  const html = `
    <div class="modal-backdrop" id="bulkModal" onclick="if(event.target===this) closeBulkModal()">
      <div class="modal" style="max-width:580px">
        <h3>Carga masiva de productos</h3>
        <p style="font-size:13px; color:var(--ink-soft); margin-bottom:10px; line-height:1.5">
          Sube un archivo Excel (.xlsx) o CSV con las columnas <strong>Nombre, Categoría, Precio, Stock, Stock Mínimo</strong> — el mismo formato que puedes exportar de tu sistema de facturación. Si el nombre de un producto ya existe, se actualizará su precio y stock.
        </p>
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap">
          <button type="button" class="btn btn-outline btn-sm" onclick="descargarPlantilla()">⬇ Descargar plantilla</button>
          <input type="file" id="bulkFile" accept=".xlsx,.xls,.csv" onchange="handleBulkFile(this)">
        </div>
        <div id="bulkPreviewArea"></div>
        <div style="display:flex; gap:8px; margin-top:14px; justify-content:flex-end">
          <button class="btn btn-outline" onclick="closeBulkModal()">Cancelar</button>
          <button class="btn btn-primary" id="bulkConfirmBtn" style="display:none" onclick="confirmBulkImport()">Confirmar importación</button>
        </div>
      </div>
    </div>`;
  document.getElementById('content').insertAdjacentHTML('beforeend', html);
}
function closeBulkModal(){ const m=document.getElementById('bulkModal'); if(m) m.remove(); state.bulkPreview=[]; }

function descargarPlantilla(){
  try{
    const wsData = [
      ['Nombre','Categoría','Precio','Stock','Stock Mínimo'],
      ['Cuaderno cuadriculado 100 hojas','Útiles escolares',6.5,40,10],
      ['Témperas x6 colores','Arte y manualidades',12.5,15,5]
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Productos');
    XLSX.writeFile(wb, 'plantilla_productos_PN_Group.xlsx');
  }catch(e){ toast('No se pudo generar la plantilla'); }
}

function handleBulkFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length===0){ toast('El archivo no tiene filas de datos'); return; }
      procesarFilasBulk(rows);
    }catch(err){
      toast('No se pudo leer el archivo. Verifica que sea un Excel o CSV válido.');
    }
  };
  reader.onerror = () => toast('Error al leer el archivo');
  reader.readAsArrayBuffer(file);
}

function getCampo(row, aliases){
  for(const key in row){
    if(aliases.includes(key.toString().trim().toLowerCase())) return row[key];
  }
  return undefined;
}

function procesarFilasBulk(rows){
  const aliasNombre=['nombre','producto','nombre del producto'];
  const aliasCat=['categoría','categoria'];
  const aliasPrecio=['precio','precio (s/)','precio s/'];
  const aliasStock=['stock','stock actual','cantidad'];
  const aliasStockMin=['stock mínimo','stock minimo','stock min','stockmin'];

  state.bulkPreview = rows.map(row=>{
    const nombre = (getCampo(row, aliasNombre)||'').toString().trim();
    const categoria = (getCampo(row, aliasCat)||'').toString().trim();
    const precio = parseFloat(getCampo(row, aliasPrecio));
    const stock = parseInt(getCampo(row, aliasStock));
    let stockMin = parseInt(getCampo(row, aliasStockMin));
    if(isNaN(stockMin)) stockMin = 3;
    let error = null;
    if(!nombre) error='Falta nombre';
    else if(!categoria) error='Falta categoría';
    else if(isNaN(precio) || precio<0) error='Precio inválido';
    else if(isNaN(stock) || stock<0) error='Stock inválido';
    const existe = state.products.some(p=>p.nombre.toLowerCase()===nombre.toLowerCase());
    return { nombre, categoria, precio, stock, stockMin, error, accion: error ? null : (existe?'actualizar':'nuevo') };
  });
  renderBulkPreview();
}

function renderBulkPreview(){
  const area = document.getElementById('bulkPreviewArea');
  const nuevos = state.bulkPreview.filter(r=>r.accion==='nuevo').length;
  const actualizados = state.bulkPreview.filter(r=>r.accion==='actualizar').length;
  const errores = state.bulkPreview.filter(r=>r.error).length;
  area.innerHTML = `
    <div style="display:flex; gap:8px; margin:10px 0; flex-wrap:wrap">
      <span class="pill">${nuevos} nuevos</span>
      <span class="pill" style="background:var(--blue-soft); color:var(--blue)">${actualizados} a actualizar</span>
      ${errores ? `<span class="stamp-badge st-bajo">${errores} con error</span>` : ''}
    </div>
    <div style="max-height:220px; overflow:auto; border:1px solid var(--paper-line); border-radius:6px">
      <table>
        <thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th></tr></thead>
        <tbody>
        ${state.bulkPreview.map(r=>`<tr>
          <td>${r.nombre||'—'}</td>
          <td>${r.categoria||'—'}</td>
          <td class="price">${isNaN(r.precio)?'—':fmt(r.precio)}</td>
          <td class="mono">${isNaN(r.stock)?'—':r.stock}</td>
          <td>${r.error ? `<span style="color:var(--stamp); font-size:12px">${r.error}</span>` : (r.accion==='nuevo' ? '<span style="color:var(--forest); font-size:12px">Nuevo</span>' : '<span style="color:var(--blue); font-size:12px">Actualizar</span>')}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  const validos = state.bulkPreview.filter(r=>!r.error).length;
  const confirmBtn = document.getElementById('bulkConfirmBtn');
  confirmBtn.style.display = validos>0 ? 'inline-block' : 'none';
  confirmBtn.textContent = `Confirmar importación (${validos})`;
}

function confirmBulkImport(){
  const categoriasSet = new Set(state.categories);
  const categoriasNuevas = [];
  const productosAfectados = [];
  state.bulkPreview.filter(r=>!r.error).forEach(r=>{
    if(!categoriasSet.has(r.categoria)){ categoriasSet.add(r.categoria); categoriasNuevas.push(r.categoria); }
    const existente = state.products.find(p=>p.nombre.toLowerCase()===r.nombre.toLowerCase());
    if(existente){
      Object.assign(existente, { categoria:r.categoria, precio:r.precio, stock:r.stock, stockMin:r.stockMin });
      productosAfectados.push(existente);
    } else {
      const nuevo = { id:nextId('p', state.products), nombre:r.nombre, categoria:r.categoria, precio:r.precio, stock:r.stock, stockMin:r.stockMin, foto:'' };
      state.products.push(nuevo);
      productosAfectados.push(nuevo);
    }
  });
  state.categories = Array.from(categoriasSet);
  closeBulkModal();
  toast('Productos importados correctamente');
  render();
  productosAfectados.forEach(p=>guardarProducto(p));
  categoriasNuevas.forEach(c=>guardarCategoriaDB(c));
}

function handlePhotoSelect(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 150*1024){ toast('La imagen es muy pesada, usa una menor a 150KB (Firestore tiene un límite de 1MB por documento y varias fotos comparten el mismo)'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('f-foto-data').value = reader.result;
    const preview = document.getElementById('photoPreview');
    const img = document.createElement('img');
    img.id = 'photoPreview'; img.className = 'photo-preview'; img.src = reader.result;
    preview.replaceWith(img);
  };
  reader.onerror = () => toast('No se pudo leer la imagen');
  reader.readAsDataURL(file);
}

function saveProduct(id){
  const nombre = document.getElementById('f-nombre').value.trim();
  const categoria = document.getElementById('f-categoria').value;
  const precio = parseFloat(document.getElementById('f-precio').value);
  const stock = parseInt(document.getElementById('f-stock').value);
  const stockMin = parseInt(document.getElementById('f-stockmin').value);
  const foto = document.getElementById('f-foto-data').value;
  const autor = document.getElementById('f-autor').value.trim();
  const tamano = document.getElementById('f-tamano').value.trim();
  const paginas = document.getElementById('f-paginas').value.trim();
  const tapa = document.getElementById('f-tapa').value;
  const papel = document.getElementById('f-papel').value.trim();
  const descripcion = document.getElementById('f-descripcion').value.trim();
  if(!nombre || isNaN(precio) || isNaN(stock) || isNaN(stockMin)){ toast('Completa todos los campos correctamente'); return; }
  let producto;
  if(id){
    producto = productById(id);
    Object.assign(producto, {nombre, categoria, precio, stock, stockMin, foto, autor, tamano, paginas, tapa, papel, descripcion});
  } else {
    producto = { id:nextId('p', state.products), nombre, categoria, precio, stock, stockMin, foto, autor, tamano, paginas, tapa, papel, descripcion };
    state.products.push(producto);
  }
  closeModal(); toast('Producto guardado'); render();
  guardarProducto(producto);
}
function deleteProduct(id){
  state.products = state.products.filter(p=>p.id!==id);
  toast('Producto eliminado'); render();
  eliminarProductoDB(id);
}

function addCategory(){
  const input = document.getElementById('newCatInput');
  const val = input.value.trim();
  if(!val){ toast('Escribe un nombre de categoría'); return; }
  if(state.categories.includes(val)){ toast('Esa categoría ya existe'); return; }
  state.categories.push(val);
  toast('Categoría agregada'); render();
  guardarCategoriaDB(val);
}
function deleteCategory(c){
  if(state.products.some(p=>p.categoria===c)){ toast('No se puede eliminar: hay productos en esta categoría'); return; }
  state.categories = state.categories.filter(x=>x!==c);
  toast('Categoría eliminada'); render();
  eliminarCategoriaDB(c);
}

function avanzarEstado(id){
  const o = state.orders.find(x=>x.id===id);
  const seq = estadosPara(o.tipoEntrega);
  const idx = seq.indexOf(o.estado);
  if(idx < seq.length-1) o.estado = seq[idx+1];
  if(o.estado==='En camino' && !o.horaSalida) o.horaSalida = new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
  if(o.estado==='Entregado' && !o.horaEntrega) o.horaEntrega = new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
  toast(`Pedido ${id}: ${o.estado}`); render();
  guardarPedido(o);
}

function clientesQueCompraronLibros(){
  const mapa = new Map();
  state.orders.forEach(o=>{
    const tieneLibro = o.items.some(i=>{
      const p = productById(i.productId);
      return p && p.categoria === 'Libros';
    });
    if(!tieneLibro || !o.telefono) return;
    const cantidadLibros = o.items.filter(i=>{
      const p = productById(i.productId);
      return p && p.categoria === 'Libros';
    }).length;
    if(mapa.has(o.telefono)){
      const existente = mapa.get(o.telefono);
      existente.pedidosLibros += 1;
      if(o.correo) existente.correo = o.correo;
      if(o.fecha > existente.fecha){ existente.cliente = o.cliente; existente.fecha = o.fecha; }
    } else {
      mapa.set(o.telefono, { cliente:o.cliente, telefono:o.telefono, correo:o.correo||'', pedidosLibros:1, fecha:o.fecha, origen:'Pedido' });
    }
  });
  return Array.from(mapa.values());
}

function baseDeClientes(){
  const mapa = new Map();
  clientesQueCompraronLibros().forEach(c=> mapa.set(c.telefono, c));
  state.clientesImportados.forEach(c=>{
    if(mapa.has(c.telefono)){
      const existente = mapa.get(c.telefono);
      if(!existente.correo && c.correo) existente.correo = c.correo;
      existente.origen = existente.origen === 'Pedido' ? 'Pedido + Importado' : existente.origen;
    } else {
      mapa.set(c.telefono, { cliente:c.nombre, telefono:c.telefono, correo:c.correo||'', pedidosLibros:0, fecha:c.fecha||'', origen:'Importado' });
    }
  });
  return Array.from(mapa.values())
    .filter(c => !state.clientesExcluidos.includes(c.telefono))
    .sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
}

function descargarPlantillaClientes(){
  try{

function handleBulkClientesFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length===0){ toast('El archivo no tiene filas de datos'); return; }
      procesarFilasBulkClientes(rows);
    }catch(err){
      toast('No se pudo leer el archivo. Verifica que sea un Excel o CSV válido.');
    }
  };
  reader.onerror = () => toast('Error al leer el archivo');
  reader.readAsArrayBuffer(file);
}

function procesarFilasBulkClientes(rows){
  const aliasNombre=['nombre','cliente','nombre del cliente','nombres y apellidos'];
  const aliasCelular=['celular','teléfono','telefono','número','numero','whatsapp'];
  const aliasCorreo=['correo','email','correo electrónico','correo electronico'];

  const combinados = baseDeClientes();
  state.bulkClientesPreview = rows.map(row=>{
    const nombre = (getCampo(row, aliasNombre)||'').toString().trim();
    let celular = (getCampo(row, aliasCelular)||'').toString().trim().replace(/\D/g,'');
    const correo = (getCampo(row, aliasCorreo)||'').toString().trim();
    let error = null;
    if(!nombre) error='Falta nombre';
    else if(!celular || celular.length<6) error='Celular inválido';
    const existe = combinados.some(c=>c.telefono===celular);
    return { nombre, telefono:celular, correo, error, accion: error ? null : (existe?'actualizar':'nuevo') };
  });
  renderBulkClientesPreview();
}

    <div class="field" style="max-width:420px; margin-bottom:14px">
      <div style="position:relative">
        <input id="searchInput" type="text" placeholder="🔎 Buscar producto por nombre…" value="${state.searchQuery.replace(/"/g,'&quot;')}"
          oninput="setSearchQuery(this.value)" style="padding-left:14px">
        ${state.searchQuery ? `<button onclick="setSearchQuery('')" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:16px">✕</button>` : ''}
      </div>
    </div>
    <div class="cat-filter">
      ${cats.map(c=>`<button class="cat-chip ${state.catFilter===c?'active':''}" onclick="setCatFilter('${c}')">${c}</button>`).join('')}
    </div>
    ${q ? `<p style="font-size:13px; color:var(--ink-soft); margin:10px 0">Resultados para "<strong>${state.searchQuery}</strong>": ${filtered.length} producto${filtered.length===1?'':'s'}</p>` : ''}
    <div class="grid cards-4">
      ${filtered.map(p=>`
        <div class="product-card">
          ${p.foto ? `<img class="thumb" src="${p.foto}" alt="${p.nombre}">` : ''}
          <div class="cat-tag">${p.categoria}</div>
          <h4>${p.nombre}</h4>
          <div class="price">${fmt(p.precio)}</div>
          <div style="font-size:12px; color:var(--ink-soft)">${p.stock>0 ? p.stock+' disponibles' : 'Sin stock'}</div>
          ${tieneFichaTecnica(p) ? `<button onclick="verDetalleProducto('${p.id}')" style="background:none; border:none; padding:0; text-align:left; color:var(--blue); font-size:12px; text-decoration:underline; cursor:pointer; margin-top:2px">📖 Ver características</button>` : ''}
          <div class="row-bottom">
            <button class="btn btn-primary btn-sm" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}')">Agregar</button>
          </div>
        </div>`).join('')}
    </div>
    ${filtered.length===0?`<div class="empty">${q ? 'No encontramos productos con ese nombre.' : 'No hay productos en esta categoría.'}</div>`:''}
  `;
}
function setCatFilter(c){ state.catFilter=c; render(); }
function tieneFichaTecnica(p){
  return !!(p.autor || p.tamano || p.paginas || p.tapa || p.papel || p.descripcion);
}
function verDetalleProducto(id){
  const p = productById(id);
  if(!p) return;
  const filas = [
    ['Título', p.nombre],
    ['Autor', p.autor],
    ['Tamaño', p.tamano],
    ['Páginas', p.paginas],
    ['Tapa', p.tapa],
    ['Papel', p.papel]
  ].filter(([,v])=>v);
  const html = `
    <div class="modal-backdrop" id="detalleModal" onclick="if(event.target===this) cerrarDetalleProducto()">
      <div class="modal" style="max-width:420px">
        ${p.foto ? `<img src="${p.foto}" alt="${p.nombre}" style="width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:14px">` : ''}
        <h3>${p.nombre}</h3>
        <div class="price" style="margin-bottom:12px">${fmt(p.precio)}</div>
        <table style="margin-bottom:12px">
          <tbody>
          ${filas.map(([label,val])=>`<tr><td style="padding:4px 10px 4px 0; color:var(--ink-soft); font-size:13px; white-space:nowrap">${label}</td><td style="padding:4px 0; font-size:13px; font-weight:600">${val}</td></tr>`).join('')}
          </tbody>
        </table>
        ${p.descripcion ? `<p style="font-size:13.5px; line-height:1.6; color:var(--ink)">${p.descripcion}</p>` : ''}
        <div style="display:flex; gap:8px; margin-top:14px; justify-content:flex-end">
          <button class="btn btn-outline" onclick="cerrarDetalleProducto()">Cerrar</button>
          <button class="btn btn-primary" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}'); cerrarDetalleProducto()">Agregar al carrito</button>
        </div>
      </div>
    </div>`;
  document.getElementById('content').insertAdjacentHTML('beforeend', html);
}
function cerrarDetalleProducto(){ const m=document.getElementById('detalleModal'); if(m) m.remove(); }
function setSearchQuery(val){
  state.searchQuery = val;
  render();
  const input = document.getElementById('searchInput');
  if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}
function addToCart(id){
  const p = productById(id);
  const line = state.cart.find(c=>c.productId===id);
  const enCarrito = line?line.cantidad:0;
  if(enCarrito+1 > p.stock){ toast('No hay más stock disponible'); return; }
  if(line) line.cantidad++; else state.cart.push({productId:id, cantidad:1});
  toast(`${p.nombre} agregado al carrito`); render();
}

function aplicarCupon(){
  const codigo = document.getElementById('f-cupon').value.trim().toUpperCase();
  if(!codigo){ toast('Escribe un código de descuento'); return; }
  const cupon = state.cupones.find(c=>c.codigo===codigo);
  if(!cupon){ toast('Ese código no existe'); return; }
  if(!cupon.activo){ toast('Ese código ya no está activo'); return; }
  state.cuponAplicado = cupon;
  toast(`Cupón aplicado: -${cupon.porcentaje}%`);
  render();
}
function quitarCupon(){
  state.cuponAplicado = null;
  render();
}
function renderCarrito(){
  if(state.cart.length===0){
    return `<div class="panel"><div class="empty">Tu carrito está vacío. Ve al catálogo para agregar productos.</div></div>`;
  }
  const subtotal = state.cart.reduce((s,c)=>s + c.cantidad*productById(c.productId).precio, 0);
  const descuento = state.cuponAplicado ? subtotal * (state.cuponAplicado.porcentaje/100) : 0;
  const total = subtotal - descuento;
  return `
    <div class="panel">
      <h3>Tu carrito</h3>
      ${state.cart.map(c=>{
        const p = productById(c.productId);
        return `<div class="cart-line">
          <div>${p.nombre}<div style="font-size:12px;color:var(--ink-soft)">${fmt(p.precio)} c/u</div></div>
          <div style="display:flex; align-items:center; gap:8px">
            <input type="number" class="qty-input" min="1" max="${p.stock}" value="${c.cantidad}" onchange="updateQty('${c.productId}', this.value)">
            <button class="btn btn-danger btn-sm" onclick="removeFromCart('${c.productId}')">Quitar</button>
          </div>
        </div>`;
      }).join('')}
      <div class="field" style="max-width:280px; margin-top:14px">
        <label>Código de descuento</label>
        <div style="display:flex; gap:8px">
          <input id="f-cupon" placeholder="Ej. SALUD10" value="${state.cuponAplicado ? state.cuponAplicado.codigo : ''}" ${state.cuponAplicado?'disabled':''} style="text-transform:uppercase">
          ${state.cuponAplicado
            ? `<button class="btn btn-outline btn-sm" onclick="quitarCupon()">Quitar</button>`
            : `<button class="btn btn-outline btn-sm" onclick="aplicarCupon()">Aplicar</button>`}
        </div>
        ${state.cuponAplicado ? `<div style="font-size:12px; color:var(--forest); margin-top:6px">✓ ${state.cuponAplicado.descripcion || 'Descuento aplicado'} (-${state.cuponAplicado.porcentaje}%)</div>` : ''}
      </div>
      <div style="padding-top:14px">
        ${descuento>0 ? `<div style="display:flex; justify-content:flex-end; gap:16px; font-size:13px; color:var(--ink-soft)"><span>Subtotal</span><span class="mono">${fmt(subtotal)}</span></div>
        <div style="display:flex; justify-content:flex-end; gap:16px; font-size:13px; color:var(--forest)"><span>Descuento (${state.cuponAplicado.porcentaje}%)</span><span class="mono">-${fmt(descuento)}</span></div>` : ''}
        <div style="display:flex; justify-content:flex-end; gap:16px; padding-top:4px; font-family:'IBM Plex Mono'; font-weight:600; font-size:16px">Total: ${fmt(total)}</div>
      </div>
    </div>
    <div class="panel">
      <h3>Datos de entrega</h3>
      <div class="form-row">
        <div class="field"><label>Nombre completo</label><input id="f-nombrecliente" placeholder="Nombres y apellidos"></div>
        <div class="field"><label>Número de celular</label><input id="f-celular" type="tel" placeholder="9xxxxxxxx"></div>
        <div class="field"><label>Correo electrónico (opcional)</label><input id="f-correocliente" type="email" placeholder="tucorreo@ejemplo.com"></div>
      </div>
      <div class="field">
        <label>Tipo de entrega</label>
        <select id="f-tipoentrega" onchange="toggleDireccion()">
          <option value="delivery">Delivery</option>
          <option value="recojo">Recojo en tienda</option>
        </select>
      </div>
      <div id="direccionField">
        <div class="field">
          <label>Dirección de entrega</label>
          <input id="f-direccion" placeholder="Ej. Av. Ejemplo 123, distrito">
        </div>
        <div class="field">
          <label>Ubicación GPS</label>
          <div>
            <button type="button" class="btn btn-outline btn-sm" onclick="solicitarUbicacion()">📍 Compartir mi ubicación</button>
          </div>
          <div id="ubicacionStatus" style="font-size:12px; margin-top:6px; color:var(--ink-soft)">Así el repartidor llega directo a tu casa.</div>
          <input type="hidden" id="f-lat"><input type="hidden" id="f-lng">
        </div>
      </div>
      <button class="btn btn-primary" onclick="confirmarPedido()">Confirmar pedido</button>
    </div>
  `;
}
function toggleDireccion(){
  const tipo = document.getElementById('f-tipoentrega').value;
  document.getElementById('direccionField').style.display = tipo==='delivery' ? 'block':'none';
}
function solicitarUbicacion(){
  const status = document.getElementById('ubicacionStatus');
  if(!navigator.geolocation){
    status.textContent = 'Tu navegador no permite compartir ubicación. Escribe la dirección con el mayor detalle posible.';
    status.style.color = 'var(--stamp)';
    return;
  }
  status.textContent = 'Obteniendo tu ubicación…';
  status.style.color = 'var(--ink-soft)';
  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('f-lat').value = pos.coords.latitude;
      document.getElementById('f-lng').value = pos.coords.longitude;
      status.textContent = '✓ Ubicación capturada. El repartidor podrá ubicarte fácilmente.';
      status.style.color = 'var(--forest)';
    },
    err => {
      status.textContent = 'No pudimos acceder a tu ubicación (revisa los permisos del navegador). Puedes continuar solo con la dirección escrita.';
      status.style.color = 'var(--stamp)';
    },
    { enableHighAccuracy:true, timeout:10000 }
  );
}
async function updateQty(id, val){
  const p = productById(id);
  let qty = parseInt(val)||1;
  if(qty > p.stock){ qty = p.stock; toast('Cantidad ajustada al stock disponible'); }
  if(qty < 1) qty = 1;
  state.cart.find(c=>c.productId===id).cantidad = qty;
  render();
}
function removeFromCart(id){ state.cart = state.cart.filter(c=>c.productId!==id); render(); }

async function confirmarPedido(){
  const nombreCliente = document.getElementById('f-nombrecliente').value.trim();
  const celular = document.getElementById('f-celular').value.trim();
  const correoCliente = document.getElementById('f-correocliente').value.trim();
  const tipo = document.getElementById('f-tipoentrega').value;
  const direccion = tipo==='delivery' ? document.getElementById('f-direccion').value.trim() : '';
  if(!nombreCliente){ toast('Ingresa tu nombre completo'); return; }
  if(!celular || celular.length < 6){ toast('Ingresa un número de celular válido'); return; }
  if(tipo==='delivery' && !direccion){ toast('Ingresa una dirección de entrega'); return; }
  const lat = document.getElementById('f-lat').value;
  const lng = document.getElementById('f-lng').value;
  if(tipo==='delivery' && (!lat || !lng)){ toast('Comparte tu ubicación para que el repartidor pueda llegar a tu casa'); return; }
  for(const c of state.cart){
    const p = productById(c.productId);
    if(c.cantidad > p.stock){ toast(`Sin stock suficiente de ${p.nombre}`); return; }
  }
  const items = state.cart.map(c=>({productId:c.productId, cantidad:c.cantidad, precio:productById(c.productId).precio}));
  const subtotal = items.reduce((s,i)=>s+i.cantidad*i.precio,0);
  const descuento = state.cuponAplicado ? subtotal * (state.cuponAplicado.porcentaje/100) : 0;
  const total = subtotal - descuento;
  const order = {
    id: nextId('o', state.orders),
    cliente: nombreCliente,
    telefono: celular,
    correo: correoCliente,
    tipoEntrega: tipo,
    direccion,
    ubicacion: (tipo==='delivery' && lat && lng) ? { lat:parseFloat(lat), lng:parseFloat(lng) } : null,
    items,
    subtotal,
    cupon: state.cuponAplicado ? state.cuponAplicado.codigo : null,
    descuento,
    total,
    estado: 'Pendiente',
    fecha: new Date().toISOString().slice(0,10)
  };
  state.orders.push(order);
  state.misPedidosIds.push(order.id);
  const productosActualizados = items.map(i=>{ const p = productById(i.productId); p.stock -= i.cantidad; return p; });
  state.cart = [];
  state.cuponAplicado = null;
  toast('¡Pedido confirmado!'); state.clienteTab='pedidos'; render();
  guardarPedido(order);
  productosActualizados.forEach(p=>guardarProducto(p));
  notificarNuevoPedido(order);
}

function renderMisPedidos(){
  const mine = state.orders.filter(o=>state.misPedidosIds.includes(o.id)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return `
    <div class="panel">
      <h3>Mis pedidos</h3>
      ${mine.length===0 ? '<div class="empty">Todavía no has hecho pedidos en esta sesión.</div>' : `
      <table>
        <thead><tr><th>Pedido</th><th>Fecha</th><th>Tipo</th><th>Total</th><th>Estado</th></tr></thead>
        <tbody>
        ${mine.map(o=>`<tr>
          <td class="mono">${o.id}</td>
          <td>${o.fecha}</td>
          <td>${o.tipoEntrega==='delivery'?'Delivery':'Recojo en tienda'}</td>
          <td class="price">${fmt(o.total)}${o.cupon ? `<div style="font-size:11px; color:var(--forest); font-weight:600">🏷️ ${o.cupon}</div>` : ''}</td>
          <td><span class="stamp-badge ${stampClass(o.estado)}">${o.estado}</span></td>
        </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

/* ================= REPARTIDOR ================= */
function renderRepartidor(){
  const pendientes = state.orders.filter(o=>o.tipoEntrega==='delivery' && o.estado==='Pendiente');
  const enCamino = state.orders.filter(o=>o.tipoEntrega==='delivery' && o.estado==='En camino');
  const entregadosHoy = state.orders.filter(o=>o.tipoEntrega==='delivery' && o.estado==='Entregado');
  const clienteInfo = (o) => `
    <div class="mono" style="font-weight:600">${o.id} — ${o.cliente}</div>
    <div style="font-size:13px; color:var(--ink-soft); margin:2px 0">${o.direccion}</div>
    <div style="font-size:12px">Cel: ${o.telefono || '—'}</div>
    <div style="font-size:12px">${o.items.map(i=>productById(i.productId)?.nombre+' x'+i.cantidad).join(', ')}</div>
    <div class="price" style="margin-top:4px">${fmt(o.total)}</div>
  `;
  return `
    <div style="display:flex; justify-content:flex-end; margin-bottom:10px">
      <button class="btn btn-outline btn-sm" onclick="logout('repartidor')">Cerrar sesión</button>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Pedidos pendientes</h3><span class="stamp-badge st-pendiente">${pendientes.length} por iniciar</span></div>
      ${pendientes.length===0 ? '<div class="empty">No hay pedidos pendientes de reparto por ahora.</div>' : pendientes.map(o=>`
        <div class="cart-line" style="align-items:flex-start">
          <div>${clienteInfo(o)}</div>
          <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end">
            ${o.ubicacion ? `<a class="btn btn-outline btn-sm" href="https://www.google.com/maps?q=${o.ubicacion.lat},${o.ubicacion.lng}" target="_blank" rel="noopener">📍 Ver ubicación</a>` : '<span style="font-size:11px; color:var(--ink-soft)">Sin GPS, usar dirección</span>'}
            <label style="display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; cursor:pointer">
              <input type="checkbox" onclick="if(this.checked) iniciarReparto('${o.id}'); else this.checked=true;">
              Pendiente → Iniciar reparto
            </label>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="panel">
      <div class="panel-head"><h3>En camino</h3><span class="stamp-badge st-camino">${enCamino.length} en ruta</span></div>
      ${enCamino.length===0 ? '<div class="empty">No hay pedidos en camino asignados por ahora.</div>' : enCamino.map(o=>`
        <div class="cart-line" style="align-items:flex-start">
          <div>
            ${clienteInfo(o)}
            ${o.horaSalida ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:3px">Salida: ${o.horaSalida}</div>` : ''}
          </div>
          <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end">
            ${o.ubicacion ? `<a class="btn btn-outline btn-sm" href="https://www.google.com/maps?q=${o.ubicacion.lat},${o.ubicacion.lng}" target="_blank" rel="noopener">📍 Ver ubicación</a>` : ''}
            <button class="btn btn-primary btn-sm" onclick="marcarEntregado('${o.id}')">Marcar como entregado</button>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="panel">
      <h3>Entregados</h3>
      ${entregadosHoy.length===0 ? '<div class="empty">Aún no hay entregas completadas.</div>' : `
      <table>
        <thead><tr><th>Pedido</th><th>Cliente</th><th>Dirección</th><th>Salida</th><th>Entrega</th><th>Total</th></tr></thead>
        <tbody>
        ${entregadosHoy.map(o=>`<tr><td class="mono">${o.id}</td><td>${o.cliente}</td><td>${o.direccion}</td><td>${o.horaSalida||'—'}</td><td>${o.horaEntrega||'—'}</td><td class="price">${fmt(o.total)}</td></tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}
function iniciarReparto(id){
  const o = state.orders.find(x=>x.id===id);
  o.estado = 'En camino';
  o.horaSalida = new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
  toast(`Reparto iniciado — salida registrada a las ${o.horaSalida}`);
  render();
  guardarPedido(o);
}
function marcarEntregado(id){
  const o = state.orders.find(x=>x.id===id);
  o.estado = 'Entregado';
  o.horaEntrega = new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
  toast(`Pedido ${id} entregado`); render();
  guardarPedido(o);
}

/* ---------- Init ---------- */
loadData();
</script>
</body>
</html>
